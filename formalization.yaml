    type: "lecture-notes"
    location: "jmilne.org, 2020; every item mapped in docs/results/books/milne-ant.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Basic Number Theory"
    authors:
      - "André Weil"
    type: "book"
    location: "3rd edition, Springer, 1974; Chapters I-VII mapped in docs/results/books/weil-bnt.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Fourier analysis in number fields and Hecke's zeta-functions"
    authors:
      - "John Tate"
    type: "book-chapter"
    location: "J. W. S. Cassels and A. Fröhlich (eds.), Algebraic Number Theory, Academic Press, 1967, Chapter XV; locators [unverified]; docs/results/books/tate-thesis.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "A Course in Abstract Harmonic Analysis"
    authors:
      - "Gerald B. Folland"
    type: "book"
    location: "2nd edition, CRC Press, 2016, Chapter 4 (Theorems 4.18, 4.32, 4.33); docs/results/books/pontryagin.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Elliptic Curves (2nd edition)"
    authors:
      - "James S. Milne"
    type: "book"
    location: "2020, Chapter V, sections 1-3 and 7; docs/results/books/modular-curves.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Further references"
    type: "bibliography"
    location: "references.bib in this repository; each result is tagged with @[kb \"<key>\" \"<locator>\"]"
    relationship: "background"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: "Built on Mathlib v4.35.0. docs/results/comparison.md says what each headline adds to Mathlib master (df6966d0d, 2026-11-07)."
  - id: "https://github.com/jonhanke/quadratic-forms-lean"
    relationship: "builds-on"
    note: "A Lake dependency (tag v0.3.0): local Fourier analysis, self-dual measures, adelic Poisson summation, local zeta integrals and the @[kb] citation attribute."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "builds-on"
    note: >-
      Files of Tau Ceti that this library needs (among them Bochner's theorem, the Peter-Weyl theorem and the
      Riemann-Roch theorem for function fields) are ported to Lean and Mathlib v4.35.0 in NumberFieldKB/TauCetiPort/,
      with their headers, license and authors kept (see NOTICE). Tau Ceti also has, independently, Chebotarev's
      theorem with natural density, the S-unit theorem and Hermite-Minkowski with ramification in S; these are
      proved here too but are not headlines. docs/results/comparison.md compares each headline with Tau Ceti main
      (d7b47803c, 2026-11-07).

status:
  scope: >-
    Formalized (the 20 statements of Challenge.lean, proved in Solution.lean): Milne ANT 3, Weil 4 (number fields 2,
    function fields 2), Tate's thesis 5, Pontryagin duality 4, the modular curves X_0(N) 4. The book maps give the
    status of every item of the five texts. The library also ships the files of its class field theory, elliptic
    curve, Chebotarev, non-vanishing and Hilbert class field topics that these books import; those topics are not
    part of this release's books, and some of their files state named results without proof (no headline uses them).
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms.lean and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git branch, with Lean kernel builds (lake build)
        as the check and pull requests merged into the main branch; human direction throughout.
      prompting_notes: >-
        Human-chosen books and results; agents worked item by item from coverage tables of each book, with
        handoff notes between sessions. The human chose the books, the conventions and the proof routes (Tate's
        adelic route for the zeta and L-functions; the Fourier inversion route, through Bochner's theorem, for
        Pontryagin duality; an algebraic genus via Riemann-Roch for X_0(N)).
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written almost entirely by Claude Opus 5.5,
    with a share by Claude Sonnet 5.5, in October and November 2026. All proofs are checked by the Lean kernel; the
    headline statements are collected in Challenge.lean for human review.

fidelity:
  divergences: >-
    (1) Where the library states a result as a named structure (for example Prop2_4 and Thm2_3 of Milne, Elliptic
    Curves, V), Challenge.lean unfolds the structure into its field. (2) Continuations defined by cases in the library (global zeta integral, Dedekind zeta,
    completed Dedekind zeta) are stated in Challenge.lean as "there exists a continuation with these properties", so
    that no headline depends on how the library chose the values at the poles. (3) The genus of X_0(N) is the genus
    of the function field Q(X_0(N)) in the sense of Riemann's theorem (Milne, Elliptic Curves, I, Theorem 4.13),
    not of a compact Riemann surface; nu_2 and nu_3 are given by their closed forms. (4) Weil's additive notation for
    locally compact abelian groups is written multiplicatively, with Mathlib's PontryaginDual. (5) Milne EC V,
    Theorem 2.3 is stated as equality of functions off a discrete subset of the upper half plane (values at poles are
    Lean default values). (6) Literature locators marked [unverified] have not been checked against the sources;
    the Tate's thesis map is built from the library's citations of Chapter XV, not from an audit of the text.

review:
  status: "not yet reviewed: the 20 headline statements of Challenge.lean and the definitions they use have not yet been reviewed by a human"
  reviewers: []
  notes: >-
    The headline statements and the definitions they use have not yet been reviewed by a human; that review is
    planned. The rest of the library has not been reviewed by a human, and there has been no external review. Lean
    checks the proofs; lake comparator checks that Solution.lean proves exactly the Challenge.lean statements using
    only the standard axioms.

