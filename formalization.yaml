# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "algebraic-number-theory-lean (NumberFieldKB): number fields, Tate's thesis and Hecke L-functions"
  description: >-
    A Lean 4 + Mathlib formalization of five texts of algebraic number theory, item by item: Milne's Algebraic
    Number Theory; Weil's Basic Number Theory, Chapters I-VII (number fields and function fields over finite
    fields); Tate's thesis (Cassels-Frohlich, Chapter XV) over every number field; Pontryagin duality for locally
    compact abelian groups (Folland, Chapter 4; Weil II.5 and VII.2); and the modular curves X_0(N) (Milne,
    Elliptic Curves, Chapter V, sections 1-3). Principal results: Kummer's theorem for regular primes; Dedekind's
    factorization theorem over every number field; Ostrowski's theorem for number fields; self-duality of the
    adeles; the zeta function and the Hecke L-functions of a function field over a finite field; Tate's main
    theorem (continuation, functional equation and residues of the global zeta integral), the functional
    equation of Hecke L-functions with root number, and the continuation and functional equation of the
    Dedekind zeta function over every number field; Pontryagin duality, Fourier inversion with the dual measure
    and the annihilator correspondences; the genus of X_0(N), the modular polynomial over Q, the function field
    C(j, j_N) and dim S_2(Gamma_0(N)) = g. Each item of the books is mapped to its Lean declaration and status in
    docs/results/books/.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

classification:
  arxiv: ["math.NT"]
  # 11R04 algebraic numbers, rings of algebraic integers; 11R42 zeta functions and L-functions of number fields;
  # 11R56 adele rings and groups; 11S40 zeta functions and L-functions of local fields; 11R58 arithmetic theory of
  # algebraic function fields; 43A40 character groups and dual objects; 11F03 modular and automorphic functions;
  # 03B35 mechanization of proofs and logical operations.
  msc2020: ["11R04", "11R42", "11R56", "11S40", "11R58", "43A40", "11F03", "03B35"]

